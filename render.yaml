services:
  - type: web
    name: quizo-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://192.168.1.73:3000,https://minikahoot.amiralialtai07.workers.dev"
      - key: QUIZ_REQUIRE_HOST_TOKEN
        value: "1"
